services:
  postgres:
    image: postgres:16-alpine
    container_name: kisanslot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kisanslot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kisanslot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-kisanslot_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kisanslot} -d ${POSTGRES_DB:-kisanslot_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

